name: Media integration
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  media:
    name: FFmpeg / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegArchive = Join-Path $env:RUNNER_TEMP 'rockcord-ffmpeg.zip'
          $ffmpegDirectory = Join-Path $env:RUNNER_TEMP 'rockcord-ffmpeg'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $ffmpegArchive
          Expand-Archive -LiteralPath $ffmpegArchive -DestinationPath $ffmpegDirectory
          $ffmpegBinary = Get-ChildItem -LiteralPath $ffmpegDirectory -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$ffmpegBinary) { throw 'Installed FFmpeg executable was not found' }
          "FFMPEG_PATH=$($ffmpegBinary.FullName)" >> $env:GITHUB_ENV
          $ffmpegBinary.DirectoryName >> $env:GITHUB_PATH
      - run: npm ci
      - run: npm run test:media
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-results-${{ matrix.os }}
          path: |
            .tmp/media-local-result.json
            .tmp/recording-result.json
          if-no-files-found: ignore
          include-hidden-files: true
